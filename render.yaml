# Render Blueprint - Complete Stack (Database + Backend + Frontend)
databases:
  - name: task-management-db
    databaseName: task-management
    user: taskmgr
    plan: free
    region: oregon

services:
  # Backend API
  - type: web
    name: task-management-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd backend && npm ci && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://task-management-w4ai-swart.vercel.app
      - key: BACKEND_URL
        value: https://task-management-backend-v2mh.onrender.com
      - key: BRAND_COMPANY_NAME
        sync: false

  # Frontend Web
  - type: web
    name: task-management-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://task-management-backend-v2mh.onrender.com
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://task-management-backend-v2mh.onrender.com
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: production
      - key: NEXT_PUBLIC_IMAGE_HOSTNAME
        value: task-management-backend-v2mh.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: NEXT_PUBLIC_CAPABILITIES_PATH
        value: /system/capabilities
      - key: NEXT_PUBLIC_CAPACITOR_SERVER_URL
        value: https://task-management-w4ai-swart.vercel.app
